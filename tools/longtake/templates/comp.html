<!doctype html>
<html><head><meta charset="utf-8">
<title>longtake composition</title>
<!--
  PFEC longtake starter: a seminar opener in one continuous take (13.5 s, 9:16).
  One hero shape never leaves the screen -- it is a dot, then a pill, then the
  event card, then the whole frame -- so every beat grows out of the last.

    dot (0.25) -> pill (1.3) -> card (3.1) -> full bleed + slam (5.5)
    -> words collapse into a line (8.4) -> line underlines the lockup (9.4)

  Preview: open in Chrome (space = pause, drag the bar to scrub).
  Check:   python ../../tools/longtake/check.py comp.html
  Render:  python ../../tools/longtake/render.py comp.html --out draft.mp4 --draft

  Everything marked SAMPLE COPY must be replaced with this event's real
  details before anything ships. The 7-office line is house format -- keep it.
-->
<style>
  @font-face { font-family: Poppins; font-weight: 400; src: url(fonts/Poppins-Regular.ttf); }
  @font-face { font-family: Poppins; font-weight: 500; src: url(fonts/Poppins-Medium.ttf); }
  @font-face { font-family: Poppins; font-weight: 600; src: url(fonts/Poppins-SemiBold.ttf); }
  @font-face { font-family: Poppins; font-weight: 700; src: url(fonts/Poppins-Bold.ttf); }
  @font-face { font-family: Poppins; font-weight: 800; src: url(fonts/Poppins-ExtraBold.ttf); }
  @font-face { font-family: Poppins; font-weight: 900; src: url(fonts/Poppins-Black.ttf); }
  html, body { margin: 0; padding: 0; }
  body.preview { background: #1b1b1f; }
  #stage { position: relative; overflow: hidden; font-family: Poppins, sans-serif; }
  #bg, #world { position: absolute; left: 0; top: 0; }
  #bg { width: 100%; height: 100%; }
  .lt { position: absolute; left: 0; top: 0; white-space: nowrap; text-align: center; }
  #lt-scrub { width: 100%; margin-top: 8px; }
  #kicker { font-weight: 800; font-size: 60px; letter-spacing: 6px; color: #100796; }
  #title { font-weight: 900; font-size: 108px; line-height: 1.02; color: #100796; }
  #meta { font-weight: 600; font-size: 44px; line-height: 1.45; color: #100796; }
  #slam { font-weight: 900; font-size: 230px; line-height: 0.95; color: #100796; }
  #slam span { display: block; }
  #slam span:last-child { font-size: 158px; }   /* ANYTHING: 8 heavy caps must clear 1080px */
  #logo { width: 620px; }
  #offices { font-weight: 600; font-size: 40px; line-height: 1.55; color: rgba(255,255,255,.88); }
  #cta { font-weight: 700; font-size: 48px; color: #FFC500; }
</style>
<script src="longtake.js"></script>
</head><body>
<div id="stage">
  <div id="bg"></div>
  <div id="world">
    <div class="lt" id="shape" data-lt="shape"></div>
    <div class="lt" id="kicker" data-lt="kicker">FREE SEMINAR</div>
    <div class="lt" id="title" data-lt="title">VISA<br>PATHWAYS 101</div>                 <!-- SAMPLE COPY -->
    <div class="lt" id="meta" data-lt="meta">SAT 8 NOV · 10:00 AM<br>PFEC LAKEMBA</div>     <!-- SAMPLE COPY -->
    <div class="lt" id="slam" data-lt="slam"><span>ASK</span><span>US</span><span>ANYTHING</span></div>
    <div class="lt" id="line" data-lt="line"></div>
    <img class="lt" id="logo" data-lt="logo" src="logo/pfec-logo-white.svg" alt="PFEC">
    <div class="lt" id="offices" data-lt="offices">Melbourne · Sydney · Lakemba · Adelaide<br>Perth · Brisbane · Parramatta</div>
    <div class="lt" id="cta" data-lt="cta">pfecglobal.com.au</div>
  </div>
</div>
<script>
const { key, morph, set, el, pop, spring, springEase, prog, ease, clamp, BRAND: B } = LT;
const W = 1080, H = 1920, DUR = 13.5;
const $ = id => document.getElementById(id);
const titleWords = LT.split($("title"), "words");   // split once, at build time
const metaWords = LT.split($("meta"), "words");
const officeWords = LT.split($("offices"), "words");
const slamLines = [...$("slam").children];
const settle = springEase(1.8, 0.72);               // the house "carry" spring
const snappy = springEase(2.6, 0.62);

// Beat times -- deliberately uneven (1.3 / 1.8 / 2.4 / 2.9 / 1.0 / 4.1 s gaps).
const T = { dot: 0.25, pill: 1.3, card: 3.1, push: 5.5, slam: [6.25, 6.6, 6.95], collapse: 8.4, lockup: 9.4 };

function render(t) {
  // background: deep navy throughout (the shape carries every colour change)
  $("bg").style.background = B.deep;

  // ---- camera: locked for the build, a push into the card, a settle, handheld rests
  const cam = LT.camera(t, [
    { t: 0, x: 540, y: 960, zoom: 1 },
    { t: T.push, x: 540, y: 960, zoom: 1 },
    { t: T.push + 0.55, x: 540, y: 930, zoom: 1.32, ease: "inOutExpo" },
    { t: T.slam[0] + 0.05, x: 540, y: 960, zoom: 1.0, ease: snappy },
    { t: T.collapse, x: 540, y: 960, zoom: 1.0 },
    { t: T.lockup + 0.9, x: 540, y: 1000, zoom: 1.06, ease: settle },
  ], { hand: 7, handSeed: 4, holdStill: [[4.3, 5.3], [11.4, 13.5]],
       hits: T.slam.map((s, i) => ({ t: s + 0.04, amp: [22, 16, 26][i], dur: 0.4 })) });
  LT.applyCamera($("world"), cam, W, H);

  // ---- the hero shape: dot -> pill -> card -> full bleed -> navy field
  const p = pop(t, T.dot, { freq: 2.4, damp: 0.5 });
  const s = morph(t, [
    [0, { x: 540, y: 960, w: 120, h: 120, r: 60, fill: B.gold }],
    [T.pill, { w: 120, h: 120, r: 60 }],
    [T.pill + 0.7, { w: 720, h: 132, r: 66 }, settle],
    [T.card, { x: 540, y: 960, w: 720, h: 132, r: 66, fill: B.gold }],
    [T.card + 0.75, { w: 880, h: 1010, r: 56, fill: B.white }, settle],
    [T.push, { w: 880, h: 1010, r: 56, fill: B.white }],
    [T.push + 0.6, { w: 1240, h: 2180, r: 0, fill: B.gold }, "inOutQuint"],
    [T.collapse, { fill: B.gold }],
    [T.collapse + 0.6, { fill: B.navy }, "inOut"],
  ]);
  set(el("shape"), { ...s, scale: t < T.pill ? p.scale : 1, sx: t < T.pill ? p.sx : 1, sy: t < T.pill ? p.sy : 1,
                     alpha: t < T.dot ? 0 : 1 });

  // ---- kicker: typed into the pill, rides up to head the card, swept away by the push
  $("kicker").textContent = LT.typed(t, "FREE SEMINAR", T.pill + 0.35, 26) || "​";
  const kOut = prog(t, T.push, T.push + 0.4);
  set(el("kicker"), {
    x: 540, y: key(t, [[T.card, 960], [T.card + 0.75, 560, settle]]),
    scale: key(t, [[T.card, 1], [T.card + 0.75, 0.82, settle], [T.push, 0.82], [T.push + 0.4, 1.3, "in"]]),
    alpha: t < T.pill + 0.35 ? 0 : 1 - kOut,
  });

  // ---- card copy: rises in once the card has opened, leaves with the push
  const out = 1 - prog(t, T.push, T.push + 0.35);
  set(el("title"), { x: 540, y: 840, alpha: t < T.card + 0.3 ? 0 : out, scale: 1 + 0.25 * (1 - out) });
  LT.rise(t, titleWords, T.card + 0.4, { stagger: 0.07, dist: 70 });
  set(el("meta"), { x: 540, y: 1175, alpha: t < T.card + 0.55 ? 0 : out, scale: 1 + 0.25 * (1 - out) });
  LT.rise(t, metaWords, T.card + 0.6, { stagger: 0.03, dist: 40 });

  // ---- slam on the gold field, then crushed into the line
  const crush = settle(prog(t, T.collapse, T.collapse + 0.45));
  slamLines.forEach((ln, i) => {
    const q = pop(t, T.slam[i], { freq: 3, damp: 0.45 });
    ln.style.transform = `scale(${q.scale * q.sx},${q.scale * q.sy})`;
    ln.style.opacity = q.alpha;
  });
  set(el("slam"), { x: 540, y: 960, sy: 1 - 0.96 * crush, alpha: t < T.slam[0] ? 0 : 1 - prog(t, T.collapse + 0.25, T.collapse + 0.45) });

  // ---- the line: born from the crushed words, becomes the lockup's underline
  const l = morph(t, [
    [T.collapse + 0.2, { x: 540, y: 960, w: 860, h: 120, r: 6, fill: B.navy }],
    [T.collapse + 0.75, { w: 620, h: 12, y: 1000, fill: B.gold }, snappy],
    [T.lockup + 0.9, { y: 1000, w: 620 }],
  ]);
  set(el("line"), { ...l, alpha: t < T.collapse + 0.2 ? 0 : 1 });

  // ---- lockup: logo lifts out of the line, offices + site follow
  set(el("logo"), { x: 540, y: key(t, [[T.lockup, 1000], [T.lockup + 0.7, 868, settle]]),
                    alpha: t < T.lockup ? 0 : 1, clip: LT.reveal(t, T.lockup, 0.65, "up") });
  set(el("offices"), { x: 540, y: 1135, alpha: t < T.lockup + 0.6 ? 0 : 1 });
  LT.rise(t, officeWords, T.lockup + 0.65, { stagger: 0.035, dist: 28 });
  const c = pop(t, T.lockup + 1.35, { freq: 2.4, damp: 0.6 });
  set(el("cta"), { x: 540, y: 1300, scale: c.scale, sx: c.sx, sy: c.sy, alpha: c.alpha });
}

LT.comp({
  width: W, height: H, dur: DUR, render,
  beats: [
    { t: T.pill, name: "pill", handoff: "shape" },
    { t: T.card, name: "card", handoff: "shape" },
    { t: T.push, name: "push", handoff: "shape" },
    { t: T.collapse, name: "collapse", handoff: "shape" },
    { t: T.lockup, name: "lockup", handoff: "line" },
  ],
  // Shared cues from podcut/assets/sfx -- keep the count low (true-peak headroom).
  cues: [
    { t: T.dot, file: "pop.mp3", vol: 0.5 },
    { t: T.pill - 0.05, file: "transition-whoosh.mp3", vol: 0.3 },
    { t: T.card - 0.05, file: "transition-whoosh.mp3", vol: 0.3 },
    { t: T.slam[0] - 0.165, file: "whoosh-impact.mp3", vol: 0.55 },
    { t: T.slam[2], file: "pop.mp3", vol: 0.4 },
    { t: T.collapse, file: "transition-whoosh.mp3", vol: 0.3 },
    { t: T.lockup + 1.35, file: "success-chime.mp3", vol: 0.5 },
  ],
});
</script>
</body></html>
