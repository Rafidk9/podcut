<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Particles motion template</title>
<style>html,body{margin:0;background:#111;height:100%}body{display:flex;align-items:center;justify-content:center}
canvas{display:block;max-width:100vw;max-height:100vh;width:auto;height:auto}body.render canvas{max-width:none;max-height:none}</style>
</head><body><canvas id="c"></canvas>
<script>
if (new URLSearchParams(location.search).has('render')) document.body.classList.add('render');
// ===== STYLE DEFAULTS (edit or override with URL params) =====
const DEFAULT_DUR = 6, DEFAULT_TEXT = 'CREATE', DEFAULT_SUB = '';
const DEFAULT_COLORS = { bg: '#07040f', c1: '#8b5cf6', c2: '#c4b5fd', c3: '#f0abfc' };
// ---- shared harness (identical in every template) ----
const P = new URLSearchParams(location.search);
const W = +(P.get('w') || 1080), H = +(P.get('h') || 1920);
const DUR = +(P.get('dur') || DEFAULT_DUR);
const ALPHA = P.get('alpha') === '1';
const TEXT = P.get('text') ?? DEFAULT_TEXT;
const SUB = P.get('sub') ?? DEFAULT_SUB;
const COL = Object.assign({}, DEFAULT_COLORS);
for (const k in COL) if (P.get(k)) COL[k] = '#' + P.get(k).replace('#', '');
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
const U = Math.min(W, H), CX = W / 2, CY = H / 2;
const SANS = '"Inter","Helvetica Neue",Arial,sans-serif';
const MONO = '"JetBrains Mono","DejaVu Sans Mono",Menlo,Consolas,monospace';
const SERIF = '"Playfair Display","Didot","Bodoni 72",Georgia,serif';
let _s = 1;
const reseed = s => { _s = (s % 2147483646) + 1; };
const rnd = () => (_s = (_s * 16807) % 2147483647, (_s - 1) / 2147483646);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const TAU = Math.PI * 2;
const ease = {
  out: t => 1 - Math.pow(1 - t, 3),
  in: t => t * t * t,
  inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  back: t => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  elastic: t => t === 0 || t === 1 ? t : Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * TAU / 3) + 1,
};
function bg(c) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none'; ctx.shadowBlur = 0; if (ALPHA) ctx.clearRect(0, 0, W, H); else { ctx.fillStyle = c; ctx.fillRect(0, 0, W, H); } }
function font(wt, size, fam) { ctx.font = `${wt} ${Math.round(size)}px ${fam || SANS}`; }
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
function off(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, w | 0); c.height = Math.max(1, h | 0); return c; }
function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }
function hexRGB(hex) { const n = parseInt(hex.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
// fit a line of text to a max width
function fitFont(txt, wt, maxSize, maxW, fam) { let s = maxSize; font(wt, s, fam); const m = ctx.measureText(txt).width; if (m > maxW) s *= maxW / m; font(wt, s, fam); return s; }
// ---- end harness head ----

// ===== STYLE =====
const N = Math.round(3400 * (W * H) / (1080 * 1920)) + 600;
// sample text pixels as targets
const tgt = [];
(() => {
  const o = off(W, H), g = o.getContext('2d');
  const lines = TEXT.split('|');
  let s = U * .34; g.font = `900 ${s}px ${SANS}`;
  const mw = Math.max(...lines.map(l => g.measureText(l).width));
  if (mw > W * .86) s *= W * .86 / mw;
  g.font = `900 ${s}px ${SANS}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#fff';
  lines.forEach((l, i) => g.fillText(l, CX, CY + (i - (lines.length - 1) / 2) * s * 1.05));
  const d = g.getImageData(0, 0, W, H).data, st = Math.max(2, Math.round(U / 330));
  for (let y = 0; y < H; y += st) for (let x = 0; x < W; x += st) if (d[(y * W + x) * 4 + 3] > 128) tgt.push([x, y]);
})();
reseed(7);
const pts = [];
for (let i = 0; i < N; i++) {
  const t = tgt.length ? tgt[(rnd() * tgt.length) | 0] : [CX, CY];
  pts.push({ x: rnd() * W, y: rnd() * H, tx: t[0] + (rnd() - .5) * 3, ty: t[1] + (rnd() - .5) * 3,
    a: rnd() * TAU, sp: .3 + rnd(), r: .6 + rnd() * 1.8, ph: rnd() * TAU, c: rnd(), d: rnd() * .5,
    ex: (rnd() - .5) * 2, ey: (rnd() - .5) * 2 });
}
const cols = [COL.c1, COL.c2, COL.c3];
function draw(t) {
  bg(COL.bg);
  if (!ALPHA) { const g = ctx.createRadialGradient(CX, CY, 0, CX, CY, U * .9); g.addColorStop(0, hexA(COL.c1, .16)); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
  const T = t / DUR;
  ctx.globalCompositeOperation = 'lighter';
  for (const p of pts) {
    // free drift: slow orbit around center + wobble
    const ang = p.a + T * TAU * p.sp * .35;
    const fx = p.x + Math.cos(ang + p.ph) * U * .05 + Math.sin(T * TAU * 2 + p.ph) * U * .01;
    const fy = p.y + Math.sin(ang) * U * .05 + Math.cos(T * TAU * 2 + p.ph) * U * .01;
    // gather 0.22-0.42, hold to 0.72, explode 0.72-0.9, drift back
    const g = ease.inOut(prog(T, .18 + p.d * .2, .42 + p.d * .1));
    const e = ease.out(prog(T, .72, .95));
    let x = lerp(fx, p.tx + Math.sin(t * 3 + p.ph) * 1.5, g), y = lerp(fy, p.ty + Math.cos(t * 3 + p.ph) * 1.5, g);
    x += p.ex * e * U * .6 * (1 - prog(T, .95, 1)); y += p.ey * e * U * .6 * (1 - prog(T, .95, 1));
    const tw = .55 + .45 * Math.sin(t * 6 + p.ph * 3);
    const r = p.r * (U / 1080) * (1 + g * .4);
    ctx.globalAlpha = (.35 + .65 * tw) * (1 - e * .5);
    ctx.fillStyle = cols[(p.c * 3) | 0];
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
    if (p.c > .9) { ctx.globalAlpha *= .25; ctx.beginPath(); ctx.arc(x, y, r * 4, 0, TAU); ctx.fill(); }
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  if (SUB) { font(500, U * .035); ctx.textAlign = 'center'; ctx.fillStyle = hexA(COL.c2, .85 * ease.out(prog(T, .45, .55)) * (1 - prog(T, .7, .76))); ctx.fillText(SUB.toUpperCase().split('').join(' '), CX, CY + U * .28); }
}
// ---- shared harness foot ----
window.__dur = DUR;
window.renderFrame = t => { draw(t); return true; };
if (!P.has('render')) {
  const t0 = performance.now();
  const loop = () => { draw(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(loop); else loop();
}
</script>
</body></html>
