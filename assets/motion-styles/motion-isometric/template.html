<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Isometric motion template</title>
<style>html,body{margin:0;background:#111;height:100%}body{display:flex;align-items:center;justify-content:center}
canvas{display:block;max-width:100vw;max-height:100vh;width:auto;height:auto}body.render canvas{max-width:none;max-height:none}</style>
</head><body><canvas id="c"></canvas>
<script>
if (new URLSearchParams(location.search).has('render')) document.body.classList.add('render');
// ===== STYLE DEFAULTS (edit or override with URL params) =====
const DEFAULT_DUR = 6, DEFAULT_TEXT = '', DEFAULT_SUB = '';
const DEFAULT_COLORS = { bg: '#ffc6e4', c1: '#3fd6e6', c2: '#1aa3c4', c3: '#c9b8ff' };
// ---- shared harness (identical in every template) ----
const P = new URLSearchParams(location.search);
const W = +(P.get('w') || 1080), H = +(P.get('h') || 1920);
const DUR = +(P.get('dur') || DEFAULT_DUR);
const ALPHA = P.get('alpha') === '1';
const TEXT = P.get('text') ?? DEFAULT_TEXT;
const SUB = P.get('sub') ?? DEFAULT_SUB;
const COL = Object.assign({}, DEFAULT_COLORS);
for (const k in COL) if (P.get(k)) COL[k] = '#' + P.get(k).replace('#', '');
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
const U = Math.min(W, H), CX = W / 2, CY = H / 2;
const SANS = '"Inter","Helvetica Neue",Arial,sans-serif';
const MONO = '"JetBrains Mono","DejaVu Sans Mono",Menlo,Consolas,monospace';
const SERIF = '"Playfair Display","Didot","Bodoni 72",Georgia,serif';
let _s = 1;
const reseed = s => { _s = (s % 2147483646) + 1; };
const rnd = () => (_s = (_s * 16807) % 2147483647, (_s - 1) / 2147483646);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const TAU = Math.PI * 2;
const ease = {
  out: t => 1 - Math.pow(1 - t, 3),
  in: t => t * t * t,
  inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  back: t => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  elastic: t => t === 0 || t === 1 ? t : Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * TAU / 3) + 1,
};
function bg(c) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none'; ctx.shadowBlur = 0; if (ALPHA) ctx.clearRect(0, 0, W, H); else { ctx.fillStyle = c; ctx.fillRect(0, 0, W, H); } }
function font(wt, size, fam) { ctx.font = `${wt} ${Math.round(size)}px ${fam || SANS}`; }
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
function off(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, w | 0); c.height = Math.max(1, h | 0); return c; }
function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }
function hexRGB(hex) { const n = parseInt(hex.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
// fit a line of text to a max width
function fitFont(txt, wt, maxSize, maxW, fam) { let s = maxSize; font(wt, s, fam); const m = ctx.measureText(txt).width; if (m > maxW) s *= maxW / m; font(wt, s, fam); return s; }
// ---- end harness head ----

// ===== STYLE =====
// isometric block city: cubes build up in a diagonal wave, then ripple
const N = 9;
const tile = Math.min(W * .9, U * .95) / (N * 1.75);
const topC = hexRGB(COL.c1), side = hexRGB(COL.c2);
const shade = (c, k) => `rgb(${c.map(v => clamp(v * k, 0, 255) | 0).join(',')})`;
function cube(x, y, h, tint) {
  const w = tile, hw = w * .866, hh = w * .5;
  const tp = [x, y - h], c1 = shade(topC, 1.08 * tint), c2 = shade(side, 1 * tint), c3 = shade(side, .72 * tint);
  ctx.beginPath(); ctx.moveTo(tp[0], tp[1]); ctx.lineTo(tp[0] + hw, tp[1] + hh); ctx.lineTo(tp[0], tp[1] + hh * 2); ctx.lineTo(tp[0] - hw, tp[1] + hh); ctx.closePath(); ctx.fillStyle = c1; ctx.fill();
  ctx.beginPath(); ctx.moveTo(tp[0] - hw, tp[1] + hh); ctx.lineTo(tp[0], tp[1] + hh * 2); ctx.lineTo(x, y + hh * 2); ctx.lineTo(x - hw, y + hh); ctx.closePath(); ctx.fillStyle = c2; ctx.fill();
  ctx.beginPath(); ctx.moveTo(tp[0] + hw, tp[1] + hh); ctx.lineTo(tp[0], tp[1] + hh * 2); ctx.lineTo(x, y + hh * 2); ctx.lineTo(x + hw, y + hh); ctx.closePath(); ctx.fillStyle = c3; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = Math.max(1, U * .0015);
  ctx.beginPath(); ctx.moveTo(tp[0] - hw, tp[1] + hh); ctx.lineTo(tp[0], tp[1] + hh * 2); ctx.lineTo(tp[0] + hw, tp[1] + hh); ctx.stroke();
}
function draw(t) {
  bg(COL.bg);
  if (!ALPHA) { const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, COL.c3); g.addColorStop(1, COL.bg); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
  const T = t / DUR;
  const ox = CX, oy = CY - N * tile * .5 + tile * 1.5 - (TEXT ? U * .1 : 0);
  // base slab
  const hw = tile * .866, hh = tile * .5, e = N * hw, f = N * hh;
  ctx.fillStyle = 'rgba(40,20,80,.12)'; ctx.beginPath(); ctx.moveTo(ox, oy + hh + tile * .3); ctx.lineTo(ox + e, oy + hh + f + tile * .3); ctx.lineTo(ox, oy + hh + 2 * f + tile * .3); ctx.lineTo(ox - e, oy + hh + f + tile * .3); ctx.fill();
  for (let s = 0; s < N * 2 - 1; s++) for (let i = 0; i < N; i++) {
    const j = s - i; if (j < 0 || j >= N) continue;
    const x = ox + (i - j) * hw, y = oy + (i + j) * hh;
    const d = Math.hypot(i - (N - 1) / 2, j - (N - 1) / 2);
    const build = ease.back(prog(t, s * .045, s * .045 + .5));
    const wave = .5 + .5 * Math.sin(d * .9 - T * TAU * 2);
    const tower = (Math.sin(i * 12.9 + j * 78.2) * 43758.5 % 1 + 1) % 1;
    const h = build * tile * (.25 + wave * 1.1 + (tower > .85 ? 1.2 : 0));
    if (build <= 0) continue;
    cube(x, y, h, .9 + .2 * wave);
  }
  if (TEXT) { fitFont(TEXT, 900, U * .1, W * .85); ctx.textAlign = 'center'; ctx.fillStyle = '#2a1650'; ctx.fillText(TEXT, CX, oy + 2 * f + U * .22); }
  if (SUB) { font(600, U * .03); ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(42,22,80,.65)'; ctx.fillText(SUB, CX, oy + 2 * f + U * .28); }
}
// ---- shared harness foot ----
window.__dur = DUR;
window.renderFrame = t => { draw(t); return true; };
if (!P.has('render')) {
  const t0 = performance.now();
  const loop = () => { draw(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(loop); else loop();
}
</script>
</body></html>
