<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <title>PFEC Livestream Sting</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #100796;
      }
      body {
        font-family: "Poppins", sans-serif;
      }

      :root {
        --navy: #100796;
        --gold: #ffc500;
        --bar1: #100694;
        --bar2: #908ec0;
        --bar3: #c9c9e2;
        --white: #ffffff;
      }

      #stage {
        position: relative;
        width: 1080px;
        height: 1920px;
        background: var(--navy);
        display: flex;
        flex-direction: column;
        padding: 88px 80px;
        box-sizing: border-box;
        overflow: hidden;
      }

      /* ---- header: rule bar + typewriter headline ---- */
      .header-block {
        margin-top: 460px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }

      #rule-bar {
        width: 220px;
        height: 10px;
        background: var(--gold);
        margin-bottom: 32px;
        transform-origin: left center;
        transform: scaleX(0);
      }

      .headline-block {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
      }

      .hl-line {
        display: inline-flex;
        align-items: baseline;
      }

      .hl-icon {
        width: 48px;
        height: 48px;
        margin-right: 26px;
        flex-shrink: 0;
        opacity: 0;
      }

      .hl-mask {
        display: inline-block;
        overflow: hidden;
        white-space: nowrap;
        vertical-align: bottom;
      }

      .hl-text {
        display: inline-block;
        font-family: "Poppins", sans-serif;
        font-weight: 900;
        font-size: 64px;
        line-height: 1.15;
        letter-spacing: -0.01em;
        color: var(--gold);
        white-space: nowrap;
      }

      .hl-cursor {
        display: inline-block;
        width: 10px;
        height: 56px;
        background: var(--gold);
        margin-left: 6px;
        opacity: 0;
        flex-shrink: 0;
      }

      /* ---- hero: 3D chrome bar mark ---- */
      .hero-mark-scene {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        perspective: 1400px;
      }

      #hero-rotator {
        position: relative;
        width: 760px;
        height: 346px;
        transform-style: preserve-3d;
        opacity: 0;
        transform: scale(0);
      }

      .mark-layer {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .mark-layer.layer-0 {
        transform: translateZ(0px);
      }
      .mark-layer.layer-1 {
        transform: translateZ(-15px);
        filter: brightness(0.78);
      }
      .mark-layer.layer-2 {
        transform: translateZ(-30px);
        filter: brightness(0.6);
      }
      .mark-layer.layer-3 {
        transform: translateZ(-45px);
        filter: brightness(0.46);
      }
      .mark-layer.layer-4 {
        transform: translateZ(-60px);
        filter: brightness(0.34);
      }
      .mark-layer.layer-gloss {
        transform: translateZ(3px);
        opacity: 0.32;
      }

      .svg-bar1 {
        fill: var(--bar1);
      }
      .svg-bar2 {
        fill: var(--bar2);
      }
      .svg-bar3 {
        fill: var(--bar3);
      }

      /* ---- footer: split logo + CTA row ----
         Anchored with position:absolute against #stage (position:relative)
         rather than relying on flex-fill-to-bottom flow: the .clip
         visibility toggle on a flex-item child of #stage's column flow
         was breaking its flex placement (footer rendered pinned near the
         top instead of the bottom). Absolute positioning removes that
         dependency entirely. */
      #footer-row {
        position: absolute;
        left: 80px;
        right: 80px;
        bottom: 88px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        opacity: 0;
      }

      .footer-logo {
        width: 170px;
        height: auto;
        display: block;
      }
      /* The source asset's wordmark + darkest mark bar are navy (#100694),
         designed for a light background — on our #100796 navy stage that is
         effectively navy-on-navy (invisible). Recolor just that fill to
         white for real contrast; the two lighter tint-ramp bars already
         read fine on navy and are left untouched. */
      #footer-logo-svg .st0 {
        fill: #ffffff;
      }
      #footer-logo-svg .st1 {
        fill: #908ec0;
      }
      #footer-logo-svg .st2 {
        fill: #c9c9e2;
      }

      .footer-cta {
        font-family: "Poppins", sans-serif;
        font-weight: 400;
        font-size: 28px;
        color: var(--white);
        letter-spacing: 0;
      }
    </style>
  </head>

    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Measure each headline line's natural pixel width (deterministic —
        // fixed font/text/size at build time) then collapse the mask to 0
        // before the timeline reveals it via a width tween (typewriter primitive).
        const widths = {};
        document.querySelectorAll(".hl-mask").forEach((el) => {
          // +14px safety margin: guards against sub-pixel/font-metric drift
          // between measurement and the renderer's own layout pass, so the
          // fully-typed line never clips its own last glyph at steady state.
          widths[el.id] = el.scrollWidth + 14;
          el.style.width = "0px";
        });

        // 1. Rule bar wipe (0.3s - 0.8s), then holds
        tl.fromTo(
          "#rule-bar",
          { scaleX: 0 },
          { scaleX: 1, duration: 0.5, ease: "power3.out", transformOrigin: "left center" },
          0.3,
        );

        // 2. Typewriter headline (0.8s - 3.0s)
        // line 1
        tl.fromTo("#hl-mask-1", { width: 0 }, { width: widths["hl-mask-1"], duration: 0.7, ease: "power1.inOut" }, 0.8);
        tl.fromTo("#hl-cursor-1", { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "power1.inOut" }, 0.8);
        tl.to("#hl-cursor-1", { opacity: 0, duration: 0.15, ease: "power1.inOut", repeat: 3, yoyo: true }, 0.95);
        tl.set("#hl-cursor-1", { opacity: 0 }, 1.6);

        // line 2
        tl.fromTo("#hl-mask-2", { width: 0 }, { width: widths["hl-mask-2"], duration: 0.6, ease: "power1.inOut" }, 1.6);
        tl.fromTo("#hl-cursor-2", { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "power1.inOut" }, 1.6);
        tl.to("#hl-cursor-2", { opacity: 0, duration: 0.13, ease: "power1.inOut", repeat: 3, yoyo: true }, 1.75);
        tl.set("#hl-cursor-2", { opacity: 0 }, 2.3);

        // line 3 (clock icon + text), cursor settles by 3.8s (before hero lands)
        tl.fromTo("#hl-icon-3", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.inOut" }, 2.3);
        tl.fromTo("#hl-mask-3", { width: 0 }, { width: widths["hl-mask-3"], duration: 0.6, ease: "power1.inOut" }, 2.35);
        tl.fromTo("#hl-cursor-3", { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "power1.inOut" }, 2.35);
        tl.to("#hl-cursor-3", { opacity: 0, duration: 0.15, ease: "power1.inOut", repeat: 5, yoyo: true }, 2.6);
        tl.set("#hl-cursor-3", { opacity: 0 }, 3.8);

        // 3. Hero 3D chrome mark: scale/fade entrance (3.0s -> ~3.7s)
        tl.fromTo(
          "#hero-rotator",
          { opacity: 0, scale: 0 },
          { opacity: 1, scale: 1, duration: 0.7, ease: "back.out(1.6)" },
          3.0,
        );
        // then continuous linear Y-axis auto-rotate through the hold (constant
        // angular speed is the whole point of "auto-rotate" — a non-linear ease
        // here would read as a wobble, not a spin). Capped at 36deg: these are
        // flat slabs, not rounded cylinders, so past ~35-40deg yaw they degrade
        // to an illegible edge-on sliver — the hero anchor must stay readable
        // through the final hold (5.0s-6.5s).
        tl.fromTo("#hero-rotator", { rotateY: 0 }, { rotateY: 36, duration: 2.8, ease: "none" }, 3.7);

        // 4. Footer split row (4.0s -> 5.0s), then holds
        tl.fromTo("#footer-row", { y: 150, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power4.out" }, 4.0);

        tl.seek(0);
        window.__timelines["main"] = tl;
      })();
    </script>
